name: "Magic Axum API"
on:
  push:
    branches:
      - main

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker Image
        run: docker build --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} -t magic_axum_api .
      - name: Save Docker Image
        run: docker save -o magic_axum_api.tar magic_axum_api
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: rsync over SSH
        run: rsync -r ./magic_axum_api.tar ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_DIRECTORY }}
        shell: bash
      - name: Start process
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' < start.sh
        shell: bash